<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Refugio Huella Viva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="card shadow border-0 rounded-4 p-4" style="max-width: 420px; width: 100%;">
    <div class="text-center mb-4">
        <div class="bg-success bg-opacity-10 text-success rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width: 64px; height: 64px;">
            <i class="bi bi-heart-pulse-fill fs-2"></i>
        </div>
        <h4 class="fw-bold mb-0">Refugio Huella Viva</h4>
        <small class="text-muted">Sistema de Trazabilidad y Adopción Responsable</small>
    </div>

    <div th:if="${exito}" class="alert alert-success py-2 text-center small" th:text="${exito}"></div>
    <div th:if="${error}" class="alert alert-danger py-2 text-center small" th:text="${error}"></div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label fw-semibold small">Usuario o Correo Electrónico</label>
            <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                <input type="text" name="username" class="form-control" placeholder="Correo o usuario" required autofocus>
            </div>
        </div>
        <div class="mb-4">
            <label class="form-label fw-semibold small">Contraseña</label>
            <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" class="form-control" placeholder="••••••" required>
            </div>
        </div>
        <button type="submit" class="btn btn-success w-100 fw-semibold py-2 rounded-3 mb-3">
            Ingresar al Sistema
        </button>
    </form>

    <div class="text-center border-top pt-3">
        <span class="small text-muted">¿Deseas adoptar y no tienes cuenta?</span><br>
        <a th:href="@{/registro}" class="btn btn-outline-success btn-sm w-100 mt-2 fw-semibold rounded-3">
            <i class="bi bi-person-plus-fill me-1"></i> Crear cuenta de Adoptante
        </a>
    </div>
</div>

</body>
</html>
