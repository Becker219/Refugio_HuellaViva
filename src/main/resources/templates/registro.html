<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Adoptante - Refugio Huella Viva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="card shadow border-0 rounded-4 p-4" style="max-width: 440px; width: 100%;">
    <div class="text-center mb-4">
        <div class="bg-success bg-opacity-10 text-success rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width: 60px; height: 60px;">
            <i class="bi bi-person-plus-fill fs-2"></i>
        </div>
        <h4 class="fw-bold mb-0">Registro de Adoptante</h4>
        <small class="text-muted">Crea tus credenciales para postular a una adopción</small>
    </div>

    <div th:if="${error}" class="alert alert-danger py-2 text-center small" th:text="${error}"></div>

    <form th:action="@{/registro}" method="post">
        <div class="mb-3">
            <label class="form-label fw-semibold small">Nombre Completo</label>
            <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-person-vcard"></i></span>
                <input type="text" name="nombreCompleto" class="form-control" placeholder="Ej: Juan Pérez Ríos" required autofocus>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold small">Correo Electrónico</label>
            <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
                <input type="email" name="correo" class="form-control" placeholder="tucorreo@ejemplo.com" required>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold small">Contraseña</label>
            <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-key"></i></span>
                <input type="password" name="password" class="form-control" placeholder="Mínimo 4 caracteres" minlength="4" required>
            </div>
        </div>

        <button type="submit" class="btn btn-success w-100 fw-semibold py-2 rounded-3 mb-3">
            <i class="bi bi-check2-circle me-1"></i> Registrarme como Adoptante
        </button>
    </form>

    <div class="text-center border-top pt-3">
        <a th:href="@{/login}" class="text-decoration-none small text-success fw-semibold">
            <i class="bi bi-arrow-left me-1"></i> Volver al Inicio de Sesión
        </a>
    </div>
</div>

</body>
</html>
