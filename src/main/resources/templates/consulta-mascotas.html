<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Consulta de Mascotas - Huella Viva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{menu :: navbar}"></div>

<div class="container py-4">
    <h4 class="fw-bold text-success mb-3"><i class="bi bi-search me-2"></i>Consulta Multicriterio de Animales Rescatados</h4>

    <!-- Panel de Filtros -->
    <div class="card border-0 shadow-sm rounded-4 mb-4">
        <div class="card-body">
            <form th:action="@{/consultas/mascotas}" method="get" class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label small fw-semibold">Especie</label>
                    <select name="idEspecie" class="form-select form-select-sm">
                        <option value="">-- Todas --</option>
                        <option th:each="e : ${listaEspecies}" th:value="${e.idEspecie}" 
                                th:text="${e.descripcion}" th:selected="${e.idEspecie == idEspecieSel}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-semibold">Tamaño</label>
                    <select name="tamanio" class="form-select form-select-sm">
                        <option value="">-- Todos --</option>
                        <option value="Pequeño" th:selected="${tamanioSel == 'Pequeño'}">Pequeño</option>
                        <option value="Mediano" th:selected="${tamanioSel == 'Mediano'}">Mediano</option>
                        <option value="Grande" th:selected="${tamanioSel == 'Grande'}">Grande</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-semibold">Nivel de Energía</label>
                    <select name="nivelEnergia" class="form-select form-select-sm">
                        <option value="">-- Todos --</option>
                        <option value="Bajo" th:selected="${energiaSel == 'Bajo'}">Bajo</option>
                        <option value="Medio" th:selected="${energiaSel == 'Medio'}">Medio</option>
                        <option value="Alto" th:selected="${energiaSel == 'Alto'}">Alto</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-semibold">Estado Actual</label>
                    <select name="estado" class="form-select form-select-sm">
                        <option value="">-- Todos --</option>
                        <option value="APTO_ADOPCION" th:selected="${estadoSel == 'APTO_ADOPCION'}">APTO ADOPCIÓN</option>
                        <option value="EN_REHABILITACION" th:selected="${estadoSel == 'EN_REHABILITACION'}">EN REHABILITACIÓN</option>
                        <option value="ADOPTADO" th:selected="${estadoSel == 'ADOPTADO'}">ADOPTADO</option>
                    </select>
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-success btn-sm w-100 fw-semibold">
                        <i class="bi bi-funnel me-1"></i> Filtrar
                    </button>
                    <a th:href="@{/consultas/mascotas}" class="btn btn-outline-secondary btn-sm">Limpiar</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Resultados -->
    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body table-responsive">
            <table class="table table-striped align-middle small mb-0">
                <thead class="table-success">
                    <tr>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Especie</th>
                        <th>Tamaño</th>
                        <th>Energía</th>
                        <th>Fecha Rescate</th>
                        <th>Lugar Rescate</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="m : ${resultados}">
                        <td class="fw-bold" th:text="${m.codigoInterno}"></td>
                        <td th:text="${m.nombre}"></td>
                        <td th:text="${m.especie.descripcion}"></td>
                        <td th:text="${m.tamanio}"></td>
                        <td th:text="${m.nivelEnergia}"></td>
                        <td th:text="${m.fechaRescate}"></td>
                        <td th:text="${m.lugarRescate}"></td>
                        <td>
                            <span class="badge bg-secondary" th:text="${m.estado}"></span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(resultados)}">
                        <td colspan="8" class="text-center text-muted py-3">No se encontraron animales con los criterios seleccionados.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
