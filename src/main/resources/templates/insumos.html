<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mantenimiento de Insumos - Huella Viva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{menu :: navbar}"></div>

<div class="container py-4">
    <h4 class="fw-bold text-success mb-3"><i class="bi bi-capsule me-2"></i>Mantenimiento de Insumos Médicos y Alimento</h4>

    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show py-2"><span th:text="${exito}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show py-2"><span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-header bg-success text-white fw-semibold rounded-top-4">Datos del Insumo</div>
                <div class="card-body">
                    <form th:action="@{/insumos/guardar}" th:object="${insumo}" method="post">
                        <input type="hidden" th:field="*{idInsumo}">

                        <div class="mb-2">
                            <label class="form-label small fw-semibold">Descripción del Insumo</label>
                            <input type="text" th:field="*{descripcion}" class="form-control form-control-sm" required>
                        </div>

                        <div class="mb-2">
                            <label class="form-label small fw-semibold">Categoría</label>
                            <select th:field="*{categoria.idCategoria}" class="form-select form-select-sm" required>
                                <option value="">-- Seleccione --</option>
                                <option th:each="c : ${listaCategorias}" th:value="${c.idCategoria}" th:text="${c.nombre}"></option>
                            </select>
                        </div>

                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <label class="form-label small fw-semibold">Stock Actual</label>
                                <input type="number" th:field="*{stockActual}" class="form-control form-control-sm" min="0" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-semibold">Stock Mínimo</label>
                                <input type="number" th:field="*{stockMinimo}" class="form-control form-control-sm" min="1" required>
                            </div>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label small fw-semibold">Costo Unit. (S/)</label>
                                <input type="number" step="0.01" th:field="*{costoUnitario}" class="form-control form-control-sm" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-semibold">Vencimiento</label>
                                <input type="date" th:field="*{fechaVencimiento}" class="form-control form-control-sm" required>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-sm fw-semibold"><i class="bi bi-save me-1"></i> Guardar Insumo</button>
                            <a th:href="@{/insumos}" class="btn btn-outline-secondary btn-sm">Limpiar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body table-responsive">
                    <table class="table table-hover align-middle small mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Descripción</th>
                                <th>Categoría</th>
                                <th>Stock (Act/Mín)</th>
                                <th>Costo (S/)</th>
                                <th>Vencimiento</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="i : ${listaInsumos}">
                                <td th:text="${i.idInsumo}"></td>
                                <td class="fw-semibold" th:text="${i.descripcion}"></td>
                                <td th:text="${i.categoria.nombre}"></td>
                                <td>
                                    <span class="badge" th:classappend="${i.stockActual <= i.stockMinimo ? 'bg-danger' : 'bg-success'}"
                                          th:text="${i.stockActual + ' / ' + i.stockMinimo}"></span>
                                </td>
                                <td th:text="${'S/ ' + i.costoUnitario}"></td>
                                <td th:text="${i.fechaVencimiento}"></td>
                                <td class="text-center">
                                    <a th:href="@{/insumos/editar/{id}(id=${i.idInsumo})}" class="btn btn-warning btn-sm py-0 px-2"><i class="bi bi-pencil"></i></a>
                                    <a th:href="@{/insumos/eliminar/{id}(id=${i.idInsumo})}" onclick="return confirm('¿Eliminar insumo?')" class="btn btn-danger btn-sm py-0 px-2"><i class="bi bi-trash"></i></a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
