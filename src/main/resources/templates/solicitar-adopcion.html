<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Solicitar Adopción - Huella Viva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{menu :: navbar}"></div>

<div class="container py-4" style="max-width: 800px;">
    <h4 class="fw-bold text-success mb-3"><i class="bi bi-envelope-paper-heart me-2"></i>Solicitud de Adopción Responsable</h4>

    <div class="card border-0 shadow-sm rounded-4 mb-4 bg-success text-white">
        <div class="card-body d-flex justify-content-between align-items-center">
            <div>
                <span class="badge bg-white text-success mb-1" th:text="${mascota.codigoInterno}"></span>
                <h5 class="fw-bold mb-0" th:text="${'Postulando para adoptar a: ' + mascota.nombre + ' (' + mascota.especie.descripcion + ')'}"></h5>
                <small class="text-white-50" th:text="${'Tamaño: ' + mascota.tamanio + ' | Peso: ' + mascota.peso + ' kg | Energía: ' + mascota.nivelEnergia}"></small>
            </div>
            <i class="bi bi-heart-pulse-fill fs-1 text-white-50"></i>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4">
            <form th:action="@{/portal/solicitar}" th:object="${solicitud}" method="post">
                <input type="hidden" name="idMascota" th:value="${mascota.idMascota}">

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Nombre del Solicitante</label>
                        <input type="text" class="form-control bg-light" th:value="${session.usuarioLogueado.nombreCompleto}" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Correo Electrónico</label>
                        <input type="text" class="form-control bg-light" th:value="${session.usuarioLogueado.correo}" readonly>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label class="form-label small fw-semibold">DNI (8 dígitos)</label>
                        <input type="text" th:field="*{dni}" class="form-control" maxlength="8" pattern="[0-9]{8}" placeholder="Ej: 74859612" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-semibold">Teléfono / Celular</label>
                        <input type="text" th:field="*{telefono}" class="form-control" placeholder="Ej: 987654321" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-semibold">Tipo de Vivienda</label>
                        <select th:field="*{tipoVivienda}" class="form-select" required>
                            <option value="Casa con patio">Casa con patio</option>
                            <option value="Departamento amplio">Departamento amplio</option>
                            <option value="Casa sin patio">Casa sin patio</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Dirección Exacta de Domicilio y Distrito</label>
                    <input type="text" th:field="*{direccion}" class="form-control" placeholder="Ej: Av. Las Flores 1420, San Juan de Lurigancho" required>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold">¿Por qué deseas adoptar a esta mascota y qué experiencia tienes?</label>
                    <textarea th:field="*{motivo}" class="form-control" rows="3" placeholder="Cuéntanos sobre el espacio donde vivirá y tu disponibilidad para los 3 controles veterinarios post-adopción..." required></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success fw-semibold px-4">
                        <i class="bi bi-send-fill me-1"></i> Enviar Solicitud de Adopción
                    </button>
                    <a th:href="@{/portal/mascotas}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
