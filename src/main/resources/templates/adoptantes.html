<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mantenimiento de Adoptantes - Huella Viva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{menu :: navbar}"></div>

<div class="container py-4">
    <h4 class="fw-bold text-success mb-3"><i class="bi bi-people-fill me-2"></i>Mantenimiento de Adoptantes y Padrinos</h4>

    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show py-2"><span th:text="${exito}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show py-2"><span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-header bg-success text-white fw-semibold rounded-top-4">Registro de Adoptante</div>
                <div class="card-body">
                    <form th:action="@{/adoptantes/guardar}" th:object="${adoptante}" method="post">
                        <input type="hidden" th:field="*{idAdoptante}">

                        <div class="row g-2 mb-2">
                            <div class="col-5">
                                <label class="form-label small fw-semibold">DNI (8 dígitos)</label>
                                <input type="text" th:field="*{dni}" class="form-control form-control-sm" maxlength="8" pattern="[0-9]{8}" required>
                            </div>
                            <div class="col-7">
                                <label class="form-label small fw-semibold">Teléfono</label>
                                <input type="text" th:field="*{telefono}" class="form-control form-control-sm" required>
                            </div>
                        </div>

                        <div class="mb-2">
                            <label class="form-label small fw-semibold">Nombres</label>
                            <input type="text" th:field="*{nombres}" class="form-control form-control-sm" required>
                        </div>

                        <div class="mb-2">
                            <label class="form-label small fw-semibold">Apellidos</label>
                            <input type="text" th:field="*{apellidos}" class="form-control form-control-sm" required>
                        </div>

                        <div class="mb-2">
                            <label class="form-label small fw-semibold">Correo Electrónico</label>
                            <input type="email" th:field="*{correo}" class="form-control form-control-sm" required>
                        </div>

                        <div class="mb-2">
                            <label class="form-label small fw-semibold">Dirección de Domicilio</label>
                            <input type="text" th:field="*{direccion}" class="form-control form-control-sm" required>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label small fw-semibold">Tipo Vivienda</label>
                                <select th:field="*{tipoVivienda}" class="form-select form-select-sm">
                                    <option value="Casa con patio">Casa con patio</option>
                                    <option value="Departamento amplio">Departamento amplio</option>
                                    <option value="Casa sin patio">Casa sin patio</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-semibold">Evaluación</label>
                                <select th:field="*{estadoEvaluacion}" class="form-select form-select-sm">
                                    <option value="APTO">APTO</option>
                                    <option value="EN_EVALUACION">EN EVALUACIÓN</option>
                                    <option value="OBSERVADO">OBSERVADO</option>
                                </select>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-sm fw-semibold"><i class="bi bi-save me-1"></i> Guardar Adoptante</button>
                            <a th:href="@{/adoptantes}" class="btn btn-outline-secondary btn-sm">Limpiar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body table-responsive">
                    <table class="table table-hover align-middle small mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>DNI</th>
                                <th>Nombre Completo</th>
                                <th>Teléfono / Correo</th>
                                <th>Vivienda</th>
                                <th>Evaluación</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="a : ${listaAdoptantes}">
                                <td class="fw-bold" th:text="${a.dni}"></td>
                                <td th:text="${a.nombres + ' ' + a.apellidos}"></td>
                                <td th:text="${a.telefono + ' / ' + a.correo}"></td>
                                <td th:text="${a.tipoVivienda}"></td>
                                <td>
                                    <span class="badge" th:classappend="${a.estadoEvaluacion == 'APTO' ? 'bg-success' : 'bg-warning text-dark'}"
                                          th:text="${a.estadoEvaluacion}"></span>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{/adoptantes/editar/{id}(id=${a.idAdoptante})}" class="btn btn-warning btn-sm py-0 px-2"><i class="bi bi-pencil"></i></a>
                                    <a th:href="@{/adoptantes/eliminar/{id}(id=${a.idAdoptante})}" onclick="return confirm('¿Eliminar adoptante?')" class="btn btn-danger btn-sm py-0 px-2"><i class="bi bi-trash"></i></a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
