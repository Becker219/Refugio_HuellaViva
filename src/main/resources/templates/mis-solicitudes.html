<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Solicitudes de Adopción - Huella Viva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{menu :: navbar}"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold text-success mb-0">
            <i class="bi bi-journal-check me-2"></i>
            <span th:text="${session.rolUsuario == 'ADOPTANTE' ? 'Mis Solicitudes de Adopción' : 'Bandeja de Solicitudes de Adopción Recibidas'}"></span>
        </h4>
        <a th:if="${session.rolUsuario == 'ADOPTANTE'}" th:href="@{/portal/mascotas}" class="btn btn-success btn-sm fw-semibold">
            <i class="bi bi-plus-circle me-1"></i> Ver Mascotas Disponibles
        </a>
    </div>

    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show py-2">
        <span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body table-responsive">
            <table class="table table-hover align-middle small mb-0">
                <thead class="table-light">
                    <tr>
                        <th>N° Solicitud</th>
                        <th>Fecha</th>
                        <th>Mascota Solicitada</th>
                        <th>Solicitante (DNI / Teléfono)</th>
                        <th>Vivienda y Dirección</th>
                        <th>Motivo</th>
                        <th>Estado</th>
                        <th th:if="${session.rolUsuario == 'ADMINISTRADOR'}" class="text-center">Evaluar</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="s : ${listaSolicitudes}">
                        <td class="fw-bold" th:text="${'SOL-00' + s.idSolicitud}"></td>
                        <td th:text="${#temporals.format(s.fechaSolicitud, 'dd/MM/yyyy HH:mm')}"></td>
                        <td>
                            <span class="fw-bold text-success" th:text="${s.mascota.nombre}"></span>
                            <small class="text-muted d-block" th:text="${s.mascota.codigoInterno + ' - ' + s.mascota.especie.descripcion}"></small>
                        </td>
                        <td>
                            <div class="fw-semibold" th:text="${s.usuario.nombreCompleto}"></div>
                            <small class="text-muted" th:text="${'DNI: ' + s.dni + ' | Tel: ' + s.telefono}"></small>
                        </td>
                        <td>
                            <span class="badge bg-secondary mb-1" th:text="${s.tipoVivienda}"></span>
                            <small class="d-block text-muted" th:text="${s.direccion}"></small>
                        </td>
                        <td style="max-width: 240px;" th:text="${s.motivo}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${s.estadoSolicitud == 'APROBADA' ? 'bg-success' : (s.estadoSolicitud == 'RECHAZADA' ? 'bg-danger' : 'bg-warning text-dark')}"
                                  th:text="${s.estadoSolicitud}"></span>
                        </td>
                        <td th:if="${session.rolUsuario == 'ADMINISTRADOR'}" class="text-center text-nowrap">
                            <a th:href="@{/portal/solicitudes/estado/{id}/APROBADA(id=${s.idSolicitud})}" class="btn btn-success btn-sm py-0 px-2" title="Aprobar">
                                <i class="bi bi-check-lg"></i>
                            </a>
                            <a th:href="@{/portal/solicitudes/estado/{id}/RECHAZADA(id=${s.idSolicitud})}" class="btn btn-danger btn-sm py-0 px-2" title="Rechazar">
                                <i class="bi bi-x-lg"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(listaSolicitudes)}">
                        <td colspan="8" class="text-center text-muted py-4">No tienes solicitudes de adopción registradas todavía.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
