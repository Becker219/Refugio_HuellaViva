<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mascotas en Adopción - Huella Viva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{menu :: navbar}"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold text-success mb-0"><i class="bi bi-heart-fill me-2"></i>Mascotas Aptas para Adopción</h4>
            <small class="text-muted">Todos nuestros rescatados cuentan con evaluación veterinaria, vacunas y esterilización.</small>
        </div>
        <a th:href="@{/portal/mis-solicitudes}" class="btn btn-outline-success btn-sm fw-semibold">
            <i class="bi bi-journal-text me-1"></i> Ver Mis Solicitudes
        </a>
    </div>

    <div class="row g-4">
        <div class="col-md-6 col-lg-4" th:each="m : ${mascotasAptas}">
            <div class="card h-100 border-0 shadow-sm rounded-4">
                <div class="card-body p-4 d-flex flex-column justify-content-between">
                    <div>
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <span class="badge bg-success-subtle text-success fw-bold px-3 py-1 rounded-pill" th:text="${m.especie.descripcion}">Especie</span>
                            <span class="badge bg-success" th:text="${m.codigoInterno}">HV-M001</span>
                        </div>
                        <h4 class="fw-bold mb-1" th:text="${m.nombre}">Nombre</h4>
                        <p class="text-muted small mb-3">
                            <i class="bi bi-geo-alt me-1"></i>Rescatado en: <span th:text="${m.lugarRescate}"></span>
                        </p>

                        <div class="row g-2 text-center bg-light rounded-3 p-2 mb-3 small">
                            <div class="col-4 border-end">
                                <div class="text-muted">Edad</div>
                                <div class="fw-bold" th:text="${m.edadMeses + ' meses'}"></div>
                            </div>
                            <div class="col-4 border-end">
                                <div class="text-muted">Tamaño</div>
                                <div class="fw-bold" th:text="${m.tamanio}"></div>
                            </div>
                            <div class="col-4">
                                <div class="text-muted">Energía</div>
                                <div class="fw-bold" th:text="${m.nivelEnergia}"></div>
                            </div>
                        </div>

                        <p class="small text-secondary mb-3" th:text="${m.historia}"></p>
                    </div>

                    <a th:href="@{/portal/solicitar/{id}(id=${m.idMascota})}" class="btn btn-success w-100 fw-semibold rounded-3">
                        <i class="bi bi-send-check me-1"></i> Solicitar Adopción
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
