<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Auditoría de Insumos - Huella Viva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{menu :: navbar}"></div>

<div class="container py-4">
    <h4 class="fw-bold text-success mb-3"><i class="bi bi-clipboard-data me-2"></i>Consulta y Auditoría de Stock de Insumos</h4>

    <div class="card border-0 shadow-sm rounded-4 mb-4">
        <div class="card-body">
            <form th:action="@{/consultas/insumos}" method="get" class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label small fw-semibold">Categoría de Insumo</label>
                    <select name="idCategoria" class="form-select form-select-sm">
                        <option value="">-- Todas las Categorías --</option>
                        <option th:each="c : ${listaCategorias}" th:value="${c.idCategoria}"
                                th:text="${c.nombre}" th:selected="${c.idCategoria == idCategoriaSel}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-semibold">Buscar por Descripción</label>
                    <input type="text" name="texto" th:value="${textoSel}" class="form-control form-control-sm" placeholder="Ej: Vacuna, Pipeta...">
                </div>
                <div class="col-md-2">
                    <div class="form-check mb-1">
                        <input class="form-check-input" type="checkbox" name="soloCritico" value="true" id="chkCritico" th:checked="${criticoSel}">
                        <label class="form-check-label small fw-semibold text-danger" for="chkCritico">
                            Solo Stock Crítico
                        </label>
                    </div>
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-success btn-sm w-100 fw-semibold"><i class="bi bi-funnel me-1"></i> Filtrar</button>
                    <a th:href="@{/consultas/insumos}" class="btn btn-outline-secondary btn-sm">Limpiar</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body table-responsive">
            <table class="table table-striped align-middle small mb-0">
                <thead class="table-success">
                    <tr>
                        <th>ID</th>
                        <th>Descripción</th>
                        <th>Categoría</th>
                        <th>Stock Actual</th>
                        <th>Stock Mínimo</th>
                        <th>Costo Unitario</th>
                        <th>Fecha Vencimiento</th>
                        <th>Estado de Alerta</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="i : ${resultados}">
                        <td th:text="${i.idInsumo}"></td>
                        <td class="fw-bold" th:text="${i.descripcion}"></td>
                        <td th:text="${i.categoria.nombre}"></td>
                        <td th:text="${i.stockActual}"></td>
                        <td th:text="${i.stockMinimo}"></td>
                        <td th:text="${'S/ ' + i.costoUnitario}"></td>
                        <td th:text="${i.fechaVencimiento}"></td>
                        <td>
                            <span th:if="${i.stockActual <= i.stockMinimo}" class="badge bg-danger">REABASTECER URGENTE</span>
                            <span th:if="${i.stockActual > i.stockMinimo}" class="badge bg-success">STOCK NORMAL</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(resultados)}">
                        <td colspan="8" class="text-center text-muted py-3">No se encontraron insumos con los filtros aplicados.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
